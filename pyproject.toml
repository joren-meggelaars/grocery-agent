[project]
name = "grocery-agent"
version = "0.1.0"
description = "Self-hosted grocery spending tracker: receipts, shelf prices, deals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
