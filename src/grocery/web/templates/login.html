{% extends "base.html" %}
{% block title %}Sign in - Grocery Agent{% endblock %}
{% block layout %}
<div class="auth-shell">
  <main class="auth-main">
    <div class="card login-card">
      <div class="brand"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-logo"/></svg></span>Grocery Agent</div>
      <h1>Sign in</h1>
      <p class="lead">Your groceries, receipts and prices.</p>
      {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
      {% if oidc_enabled %}
      <a class="btn primary big" href="/login/oidc?next={{ next|urlencode }}">Sign in with Authentik</a>
      <p class="muted" style="text-align:center; margin: 0.75rem 0;">or with your password</p>
      {% endif %}
      <form method="post" action="/login" class="stack">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false" required {{ "" if oidc_enabled else "autofocus" }}>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn{{ "" if oidc_enabled else " primary" }} big">Sign in</button>
      </form>
    </div>
  </main>
</div>
{% endblock %}
