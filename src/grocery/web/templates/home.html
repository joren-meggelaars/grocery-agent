{% extends "base.html" %}
{% block content %}
<h1>Grocery Agent</h1>
<p class="muted">Signed in as {{ user.username }}.</p>
<section class="card">
  <h2>Status</h2>
  <p>Foundations are running: login, sessions and the security baseline. Receipts arrive in phase 1.</p>
</section>
<nav class="stack">
  <a class="btn" href="/account">Account and sessions</a>
  <form method="post" action="/logout" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="btn">Sign out</button>
  </form>
</nav>
{% endblock %}
