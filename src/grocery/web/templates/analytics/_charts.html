{% macro column_chart(chart) %}
<svg class="viz-svg" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ chart.aria }}">
  {% for t in chart.ticks %}
  <line class="viz-grid" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ '%.1f'|format(t.y) }}" y2="{{ '%.1f'|format(t.y) }}"/>
  <text class="viz-tick" x="{{ chart.plot_left - 6 }}" y="{{ '%.1f'|format(t.y + 4) }}" text-anchor="end">{{ t.text }}</text>
  {% endfor %}
  <line class="viz-axis" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ chart.baseline_y }}" y2="{{ chart.baseline_y }}"/>
  {% if chart.ref_y is not none %}
  <line class="viz-ref" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ '%.1f'|format(chart.ref_y) }}" y2="{{ '%.1f'|format(chart.ref_y) }}"/>
  <text class="viz-lbl" x="{{ chart.plot_right + 6 }}" y="{{ '%.1f'|format(chart.ref_y - 1) }}">{{ chart.ref_name }}</text>
  <text class="viz-lbl" x="{{ chart.plot_right + 6 }}" y="{{ '%.1f'|format(chart.ref_y + 11) }}">{{ chart.ref_value }}</text>
  {% endif %}
  {% for m in chart.marks %}
  <g class="mark" tabindex="0" data-tip="{{ m.tip }}" aria-label="{{ m.tip }}">
    <rect class="viz-hit" x="{{ '%.1f'|format(m.hit[0]) }}" y="{{ '%.1f'|format(m.hit[1]) }}" width="{{ '%.1f'|format(m.hit[2]) }}" height="{{ '%.1f'|format(m.hit[3]) }}"/>
    {% if m.path %}<path class="viz-bar{{ '' if m.highlight else ' muted' }}" d="{{ m.path }}"/>{% endif %}
  </g>
  {% if m.label %}<text class="viz-value" x="{{ '%.1f'|format(m.label_xy[0]) }}" y="{{ '%.1f'|format(m.label_xy[1]) }}" text-anchor="middle">{{ m.label }}</text>{% endif %}
  <text class="viz-tick" x="{{ '%.1f'|format(m.name_xy[0]) }}" y="{{ '%.1f'|format(m.name_xy[1]) }}" text-anchor="middle">{{ m.name }}</text>
  {% endfor %}
</svg>
{% endmacro %}

{% macro bar_chart(chart) %}
<svg class="viz-svg" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ chart.aria }}">
  <line class="viz-axis" x1="{{ chart.baseline_x }}" x2="{{ chart.baseline_x }}" y1="0" y2="{{ chart.height }}"/>
  {% for m in chart.marks %}
  <g class="mark" tabindex="0" data-tip="{{ m.tip }}" aria-label="{{ m.tip }}">
    <rect class="viz-hit" x="{{ '%.1f'|format(m.hit[0]) }}" y="{{ '%.1f'|format(m.hit[1]) }}" width="{{ '%.1f'|format(m.hit[2]) }}" height="{{ '%.1f'|format(m.hit[3]) }}"/>
    {% if m.path %}<path class="viz-bar" d="{{ m.path }}"/>{% endif %}
  </g>
  <text class="viz-name" x="{{ '%.1f'|format(m.name_xy[0]) }}" y="{{ '%.1f'|format(m.name_xy[1]) }}" text-anchor="end">{% if m.title %}<title>{{ m.title }}</title>{% endif %}{{ m.name }}</text>
  <text class="viz-value" x="{{ '%.1f'|format(m.label_xy[0]) }}" y="{{ '%.1f'|format(m.label_xy[1]) }}">{{ m.label }}</text>
  {% endfor %}
</svg>
{% endmacro %}
